[package]
name = "fetchkit"
version = "0.1.0"
edition = "2021"
description = "Polite fetching, shared: one HTTP client, one rate limiter, one cache, one User-Agent policy"

# Deliberately NOT a dependency on anything that knows what a picture or an
# article is. This crate fetches bytes and parses the shapes the web serves
# them in; what a row MEANS belongs to whoever is doing the collecting.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "brotli", "json"] }
scraper = "0.23"
quick-xml = "0.38"
regex = "1"
url = "2"
md-5 = "0.10"
