<!doctype html>
<!-- Synthetic. The Shimmie theme where the row IS the post link, states its own
     size, MIME type and rating, and the file hash appears only in the
     thumbnail's relative URL. -->
<html>
<head><title>Example board</title></head>
<body>
<div class="shm-image-list">
  <a class="shm-thumb thumb" href="/post/view/201" data-post-id="201" data-tags="tag_a tag_b" data-rating="s" data-mime="image/jpeg" data-width="800" data-height="600">
    <img id="thumb_201" title="tag_a tag_b" src="/_thumbs/1111111111111111/thumb.jpg" width="192" height="144">
  </a>
  <a class="shm-thumb thumb" href="/post/view/202" data-post-id="202" data-tags="tag_c" data-rating="e" data-mime="video/mp4" data-width="1920" data-height="1080">
    <img id="thumb_202" title="tag_c" src="/_thumbs/2222222222222222/thumb.jpg" width="192" height="108">
  </a>
  <a class="shm-thumb thumb" href="/post/view/203" data-post-id="203" data-tags="tag_d" data-rating="q" data-mime="image/png" data-width="10" data-height="10">
    <img id="thumb_203" title="tag_d" src="//cdn.example.test/_thumbs/3333333333333333/thumb.jpg" width="10" height="10">
  </a>
</div>
<div id="paginator"><a href="/post/list/1">Prev</a></div>
</body>
</html>
