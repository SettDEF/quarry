<!doctype html>
<!-- Synthetic. The Shimmie theme where a row is a <div> holding the post link,
     the thumbnail and one absolute link to the file itself (no extension). -->
<html>
<head><title>Example board</title></head>
<body>
<section id="body">
  <div class="shm-image-list">
    <div class="shm-thumb thumb" data-ext="jpg" data-tags="tag_a tag_b" data-post-id="101">
      <a class="shm-thumb-link" href="/post/view/101"><img id="thumb_101" title="tag_a tag_b" height="192" width="192" src="https://thumbs.example.test/aa/b1/1111111111111111"></a>
      <br><a href="https://files.example.test/aa/b1/1111111111111111">Image Only</a>
      <span class="thumb-tools"><a href="#" onclick="return false;">-</a></span>
    </div>
    <div class="shm-thumb thumb" data-ext="mp4" data-tags="tag_c" data-post-id="102">
      <a class="shm-thumb-link" href="/post/view/102"><img id="thumb_102" title="tag_c" height="108" width="192" src="https://thumbs.example.test/cc/d2/2222222222222222"></a>
      <br><a href="https://files.example.test/cc/d2/2222222222222222">Image Only</a>
      <span class="thumb-tools"><a href="#" onclick="return false;">-</a></span>
    </div>
    <div class="shm-thumb thumb" data-ext="png" data-tags="tag_d tag_e tag_f" data-post-id="103">
      <a class="shm-thumb-link" href="/post/view/103"><img id="thumb_103" title="tag_d" height="192" width="132" src="https://thumbs.example.test/ee/f3/3333333333333333"></a>
      <br><a href="https://files.example.test/ee/f3/3333333333333333">Image Only</a>
      <span class="thumb-tools"><a href="#" onclick="return false;">-</a></span>
    </div>
  </div>
  <div id="paginator"><a href="/post/list/1">Prev</a> <a class="next" href="/post/list/2">Next</a></div>
</section>
</body>
</html>
