# App icons — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "appicons"
label = "App icons"
category = "icons"

[request]
url = "https://itunes.apple.com/search?term={query}&limit={limit}&media=software#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "results"
browse_term = "paint"

[capabilities]
text = true
tags = false
nsfw = false
sort = false

[map]
id = "trackId"
url = "artworkUrl512"
title = "trackName"
author = "artistName"
# No page of its own in this API — the file is the thing.
page_url = "artworkUrl512"
