# Audius art — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "audius"
label = "Audius art"
category = "art"

[request]
url = "https://discoveryprovider.audius.co/v1/tracks/trending?limit={limit}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "data"

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "artwork.1000x1000"
thumb = "artwork.150x150"
title = "title"
author = "user.name"
# No page of its own in this API — the file is the thing.
page_url = "artwork.1000x1000"
