# Devicon — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "devicon"
label = "Devicon"
category = "icons"
family = "vector"

[request]
url = "https://cdn.jsdelivr.net/gh/devicons/devicon@master/devicon.json#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "name"
url = "https://cdn.jsdelivr.net/gh/devicons/devicon@master/icons/{name}/{name}-original.svg"
title = "name"
tags = "tags"
# No page of its own in this API — the file is the thing.
page_url = "https://cdn.jsdelivr.net/gh/devicons/devicon@master/icons/{name}/{name}-original.svg"
