# e621 popular — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "e621_popular"
label = "e621 popular"
category = "art"
adult = true

[request]
url = "https://e621.net/popular.json?limit={limit}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "posts"

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "file.url"
thumb = "preview.url"
width = "file.width"
height = "file.height"
# No page of its own in this API — the file is the thing.
page_url = "file.url"
