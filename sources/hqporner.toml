# HQporner — read from its search listing. The poster only appears inside the
# row's own hover script, so it is pulled out with a pattern rather than read
# from an attribute; that is what `re` is for. Verified live 2026-09-17.
id = "hqporner"
label = "HQporner"
category = "adult"
adult = true
family = "video"

[request]
url = "https://hqporner.com/?q={query}&p={page}"
format = "html"
limit = 46
space = "+"

[capabilities]
text = true

[html]
row = "section.box.feature"
base = "https://hqporner.com"

[html.fields]
page = { sel = "a.image", attr = "href" }
id = { sel = "a.image", attr = "href", re = "/hdporn/(\\d+)" }
title = { sel = "h3" }
thumb = { sel = "div.w403px", attr = "onmouseleave", re = "defaultImage\\(\"([^\"]+)\"" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
width = "=640"
height = "=360"

# THE SITE'S OWN TABLE OF CONTENTS, as things you can pick.
# Categories run the site's own search for that word — pornhub's
# `category=` parameter rejects ids from its own categories endpoint
# (probed 2026-09-17: "Category does not exist!" for every valid id),
# so the name goes through the search, which does work.

[page_tags]
# The keywords meta IS the video's tags here, each written "… porn".
meta = "keywords"
trim_suffix = " porn"
skip = ["hd porn video", "hd sex video", "1080p", "4k", "hd"]

