# iTunes artwork — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "itunes"
label = "iTunes artwork"
category = "art"

[request]
url = "https://itunes.apple.com/search?term={query}&limit={limit}&media=music&entity=album#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "results"
browse_term = "jazz"

[capabilities]
text = true
tags = false
nsfw = false
sort = false

[map]
id = "collectionId"
url = "artworkUrl100"
title = "collectionName"
author = "artistName"
# No page of its own in this API — the file is the thing.
page_url = "artworkUrl100"
