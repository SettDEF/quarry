# lefty.pictures — Shimmie board, read from its listing HTML.
# Verified live 2026-09-17: 24 rows a page, page 2 shares no id with page 1,
# and every row carries `data-rating`, so rows are marked from the board's own
# rating rather than wholesale.

id = "lefty"
label = "lefty.pictures"
category = "adult"
# Declared adult, which is what makes every row it returns carry `nsfw`.
# Without this the category said "adult" and the ROWS said nothing, so
# switching adult content off hid the source from the filter list and left
# its pictures in the wall.
adult = true

[request]
url = "https://lefty.pictures/post/list/{query}/{page}"
format = "html"
limit = 24
space = "%20"

[capabilities]
text = true
tags = true

[html]
row = ".shm-thumb"

[html.fields]
id = { attr = "data-post-id" }
tags = { attr = "data-tags" }
rating = { attr = "data-rating" }
mime = { attr = "data-mime" }
width = { attr = "data-width" }
height = { attr = "data-height" }
thumb = { sel = "img", attr = "src" }
hash = { sel = "img", attr = "src", re = "/_thumbs/([^/]+)/" }

[map]
id = "id"
url = "https://lefty.pictures/_images/{hash}/{id}.{mime|replace:image/:|replace:video/:}"
thumb = "thumb"
ext = "mime"
width = "width"
height = "height"
tags = "tags"
tags_separator = " "
page_url = "https://lefty.pictures/post/view/{id}"
rating = "rating"
nsfw_ratings = ["q", "e"]
