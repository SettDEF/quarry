# League of Legends — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "lolddragon"
label = "League of Legends"
category = "art"

[request]
url = "https://ddragon.leagueoflegends.com/cdn/14.24.1/data/en_US/champion.json#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "data"

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "https://ddragon.leagueoflegends.com/cdn/img/champion/splash/{_key}_0.jpg"
title = "name"
tags = "tags"
# No page of its own in this API — the file is the thing.
page_url = "https://ddragon.leagueoflegends.com/cdn/img/champion/splash/{_key}_0.jpg"
