# Lorcana — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "lorcana"
label = "Lorcana"
category = "games"

[request]
url = "https://api.lorcana-api.com/cards/all#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "Unique_ID"
url = "Image"
title = "Name"
author = "Artist"
# No page of its own in this API — the file is the thing.
page_url = "Image"
