# Mastodon World — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "mastodonworld"
label = "Mastodon World"
category = "photography"

[request]
url = "https://mastodon.world/api/v1/timelines/public?only_media=true&limit={limit}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "media_attachments[0].url"
thumb = "media_attachments[0].preview_url"
width = "media_attachments[0].meta.original.width"
height = "media_attachments[0].meta.original.height"
author = "account.username"
page_url = "url"
# WHO SAYS A POST IS ADULT: the poster does.
#
# Mastodon carries a top-level `sensitive` boolean on every status — it is what
# the content warning is built from — and it was unmapped, so every row arrived
# marked safe no matter what the author ticked. With "show adult results" off,
# explicit photographs were on the wall: the daemon was filtering faithfully,
# it had simply never been told. Probed live 2026-09-29: 2 of 40 statuses on
# the public timeline were flagged.
#
# Booleans read as "true"/"false" through the same `rating`/`nsfw_ratings` pair
# a booru uses for `rating: explicit`, so this needs no new machinery.
rating = "sensitive"
nsfw_ratings = ["true"]
