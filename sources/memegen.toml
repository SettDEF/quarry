# Memegen templates — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "memegen"
label = "Memegen templates"
category = "art"

[request]
url = "https://api.memegen.link/templates#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "blank"
title = "name"
page_url = "source"
