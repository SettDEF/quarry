# nekos.moe — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "nekosmoe"
label = "nekos.moe"
category = "art"

[request]
url = "https://nekos.moe/api/v1/random/image?count={limit}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "images"

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "https://nekos.moe/image/{id}"
tags = "tags"
author = "uploader.username"
# No page of its own in this API — the file is the thing.
page_url = "https://nekos.moe/image/{id}"
