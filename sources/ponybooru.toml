# ponybooru.org — Philomena board, keyless JSON.
#
# Verified live 2026-09-24 with quarry's own User-Agent: 2,857,923 images, and
# `filter_id=2` is its "everything" filter — the anonymous default hides the
# rated rows, which on a board this size is most of what you came for.
#
# Unlike ponerpics its representations are already absolute (cdn.ponybooru.org),
# so no host is prefixed here. Rows are marked from the rating tag, the same way
# every other Philomena board in this folder is.

id = "ponybooru"
label = "Ponybooru"
category = "adult"
# Declared adult, which is what makes every row it returns carry `nsfw`.
# Without this the category said "adult" and the ROWS said nothing, so
# switching adult content off hid the source from the filter list and left
# its pictures in the wall.
adult = true

[request]
url = "https://ponybooru.org/api/v1/json/search/images?q={query}&per_page={limit}&page={page}&filter_id=2"
tag_resolver = "philomena"
# Its creator is a tag, the way the board files it — the namespace is right for
# Philomena and wrong for the gelbooru family. See xbooru.toml for the measurement.
author_tag = "artist:{author}"
limit = 50
format = "json"
root = "images"
browse_term = "*"
# A Philomena tag may contain a space, so terms are joined with a comma.
joiner = ","
video_tag = "mime_type:video/webm"

[capabilities]
author = true
text = true
tags = true
nsfw = false
sort = false

[map]
id = "id"
url = "representations.full"
thumb = "representations.thumb"
sample = "representations.medium"
title = "description"
width = "width"
height = "height"
bytes = "size"
tags = "tags"
page_url = "https://ponybooru.org/images/{id}"
rating = "tags"
nsfw_ratings = ["suggestive", "questionable", "explicit", "grimdark", "semi-grimdark", "grotesque"]
