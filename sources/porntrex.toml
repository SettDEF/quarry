# PornTrex — read from its search listing. Verified live 2026-09-17: rows a
# page, page 2 disjoint from page 1. Thumbs are protocol-relative, so the base
# carries the scheme. No dimensions published; the poster is 16:9.
id = "porntrex"
label = "PornTrex"
category = "adult"
adult = true
family = "video"

[request]
url = "https://www.porntrex.com/search/{query}/{page}/"
format = "html"
limit = 50
space = "-"

[capabilities]
text = true

[html]
row = "a.thumb"
base = "https://www.porntrex.com"

[html.fields]
page = { attr = "href" }
id = { attr = "href", re = "/video/(\\d+)" }
thumb = { sel = "img.cover", attr = "data-src" }
title = { sel = "img.cover", attr = "alt" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
width = "=640"
height = "=360"

