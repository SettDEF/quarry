# RedTube — keyless JSON, 200k+ results. Verified live 2026-09-17: empty search
# browses newest, 20 rows a page, page 2 disjoint from page 1.
# Rows are wrapped one level deep (`videos[].video`), hence the prefixed paths.
# Poster frames only, like eporner.toml; `thumbs` runs small-to-large.
id = "redtube"
label = "RedTube"
category = "adult"
adult = true
# A video, even though what the API hands over is its poster. Poster frames only, like pornhub: the viewer resolves the page when you open one.
family = "video"

[request]
url = "https://api.redtube.com/?data=redtube.Videos.searchVideos&output=json&search={query}&ordering={sort}&page={page}&thumbsize=all"
limit = 20
format = "json"
root = "videos"

[request.sort]
default = "featured"
new = "newest"
large = "mostviewed"

[capabilities]
text = true
tags = false
nsfw = false
sort = true

[map]
id = "video.video_id"
url = "video.thumbs[-1].src"
width = "video.thumbs[-1].width"
height = "video.thumbs[-1].height"
title = "video.title"
page_url = "video.url"
# The site's own tags on every video, so `tag:` and "Search its tags" work.
tags = "video.tags[].tag_name"

# The site's whole lists (111 categories, 909 tags on 2026-10-23), fetched by
# the daemon in the background; the hand-written sections below show first.
[[sections_from]]
group = "Categories"
url = "https://api.redtube.com/?data=redtube.Categories.getCategoriesList&output=json"
root = "categories"
label = "category"

[[sections_from]]
group = "Tags"
url = "https://api.redtube.com/?data=redtube.Tags.getTagList&output=json"
root = "tags"
label = "tag.tag_name"

# THE SITE'S OWN TABLE OF CONTENTS, as things you can pick.
# Categories run the site's own search for that word — pornhub's
# `category=` parameter rejects ids from its own categories endpoint
# (probed 2026-09-17: "Category does not exist!" for every valid id),
# so the name goes through the search, which does work.

[[sections]]
group = "Sort"
label = "Featured"
q = "sort:relevance"

[[sections]]
group = "Sort"
label = "Newest"
q = "sort:new"

[[sections]]
group = "Sort"
label = "Most viewed"
q = "sort:large"

