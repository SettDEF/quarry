# Rule34Video — animated and rendered work, no photographed people. Read from
# its search listing. Paging is `from_videos`, which is a page number here
# despite the name. Verified live 2026-09-17: page 2 disjoint from page 1. Thumbs are lazy-loaded, so the URL is on `data-original`.
id = "rule34video"
label = "Rule34Video"
category = "adult"
adult = true
family = "video"

[request]
url = "https://rule34video.com/search/{query}/?from_videos={page}"
format = "html"
limit = 30
space = "%20"

[capabilities]
text = true

[html]
row = "a.th"
base = "https://rule34video.com"

[html.fields]
page = { attr = "href" }
id = { attr = "href", re = "/video/(\\d+)" }
title = { attr = "title" }
thumb = { sel = "img.thumb", attr = "data-original" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
width = "=640"
height = "=360"

