# sakugabooru — animation cuts, keyframes and genga.
#
# Moebooru, like yande.re and konachan, so the mapping is theirs. What makes it
# worth a manifest of its own is what it holds: this is a board of ANIMATION,
# so a large share of its posts are webm — which is to say it is a video source
# that happens to also have stills.

id = "sakugabooru"
label = "Sakugabooru"
category = "video"

[request]
url = "https://www.sakugabooru.com/post.json?limit={limit}&page={page}&tags={tags}"
# "by this person", in this board's own vocabulary.
#
# A plain tag, NOT `artist:{author}` — measured on Danbooru 2026-09-23:
# `tags=wlop` answers 5 rows and `tags=artist:wlop` answers 0. The philomena
# boards (derpibooru and friends) are the ones that want the namespace, and
# they already declare it.
author_tag = "{author}"
tag_resolver = "moebooru"
limit = 40
format = "json"
root = ""

[capabilities]
text = true
tags = true
nsfw = false
sort = false

[map]
id = "id"
url = "file_url"
thumb = "preview_url"
sample = "sample_url"
width = "width"
height = "height"
tags = "tags"
tags_separator = " "
page_url = "https://www.sakugabooru.com/post/show/{id}"
# Moebooru ratings. Nearly every cut is `s`; the few that are not get marked.
rating = "rating"
nsfw_ratings = ["q", "e"]
