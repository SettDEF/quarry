# Steam featured — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "steamfeatured"
label = "Steam featured"
category = "art"

[request]
url = "https://store.steampowered.com/api/featuredcategories/?cc=us&l=en#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "specials.items"

[capabilities]
text = false
tags = false
nsfw = false
sort = false

[map]
id = "id"
url = "large_capsule_image"
title = "name"
# No page of its own in this API — the file is the thing.
page_url = "large_capsule_image"
