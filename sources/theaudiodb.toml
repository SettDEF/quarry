# TheAudioDB — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "theaudiodb"
label = "TheAudioDB"
category = "art"

[request]
url = "https://www.theaudiodb.com/api/v1/json/2/search.php?s={query}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "artists"
browse_term = "coldplay"

[capabilities]
text = true
tags = false
nsfw = false
sort = false

[map]
id = "idArtist"
url = "strArtistThumb"
title = "strArtist"
# No page of its own in this API — the file is the thing.
page_url = "strArtistThumb"
