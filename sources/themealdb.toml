# TheMealDB — keyless. Probed live 2026-09-22: the endpoint answered,
# the rows parsed, and the mapped fields resolved on the first row.
# Anything that failed that check is not in this directory (see TASKS.md).
id = "themealdb"
label = "TheMealDB"
category = "photography"

[request]
url = "https://www.themealdb.com/api/json/v1/1/search.php?s={query}#page={page_value}"
limit = 40
format = "json"
# Everything in one answer: one page, and the token that says so
# rides in the fragment, which is never sent to the server.
page_values = ["1"]
root = "meals"
browse_term = "a"

[capabilities]
text = true
tags = false
nsfw = false
sort = false

[map]
id = "idMeal"
url = "strMealThumb"
title = "strMeal"
tags = "strTags"
page_url = "strSource"
