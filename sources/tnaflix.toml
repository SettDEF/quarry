# TNAFlix — read from its search listing. Verified live 2026-09-17: rows a
# page, page 2 disjoint from page 1. It publishes the poster's own dimensions,
# so unlike the other tubes here the ratio is measured rather than declared.
id = "tnaflix"
label = "TNAFlix"
category = "adult"
adult = true
family = "video"

[request]
url = "https://www.tnaflix.com/search.php?what={query}&page={page}"
format = "html"
limit = 40
space = "+"

[capabilities]
text = true

[html]
row = "a.video-thumb"
base = "https://www.tnaflix.com"

[html.fields]
page = { attr = "href" }
id = { attr = "href", re = "/video(\\d+)" }
thumb = { sel = "img", attr = "src" }
title = { sel = "img", attr = "alt" }
width = { sel = "img", attr = "width" }
height = { sel = "img", attr = "height" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
width = "width"
height = "height"

