# twibooru — the third Philomena board, and the one with the newest API.
#
# `/api/v3/search/posts` rather than the v1 the other two use: the rows are
# `posts` with a `media_type`, which is how a webm is told from a picture
# without guessing from the extension.

id = "twibooru"
label = "Twibooru"
category = "adult"
adult = true

[request]
url = "https://twibooru.org/api/v3/search/posts?q={query}&per_page={limit}&page={page}"
tag_resolver = "philomena"
# Its creator is a tag, the way the board files it.
author_tag = "artist:{author}"
limit = 50
format = "json"
root = "posts"
# `*` is Philomena for "everything", newest first. `safe` was half a feed on a
# source marked adult.
browse_term = "*"
joiner = ","
video_tag = "mime_type:video/webm"

[capabilities]
author = true
text = true
tags = true
nsfw = false
sort = false

[map]
id = "id"
url = "representations.full"
thumb = "representations.thumb"
sample = "representations.medium"
title = "description"
width = "width"
height = "height"
tags = "tags"
page_url = "https://twibooru.org/{id}"
