# xnxx — the same engine and markup as xvideos, its sister site, so the same
# row shape. Verified live 2026-09-17: rows a page, page 2 disjoint from page 1.
id = "xnxx"
label = "xnxx"
category = "adult"
adult = true
family = "video"

[request]
url = "https://www.xnxx.com/search/{query}/{page0}"
format = "html"
limit = 27
space = "+"

[capabilities]
text = true

[html]
row = ".thumb-block"
base = "https://www.xnxx.com"

[html.fields]
id = { attr = "data-id" }
thumb = { sel = ".thumb img", attr = "data-src" }
page = { sel = ".thumb a", attr = "href" }
title = { sel = ".thumb-under a", attr = "title" }
author = { sel = ".uploader .name" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
author = "author"
width = "=640"
height = "=360"

# THE SITE'S OWN TABLE OF CONTENTS, as things you can pick.
# Categories run the site's own search for that word — pornhub's
# `category=` parameter rejects ids from its own categories endpoint
# (probed 2026-09-17: "Category does not exist!" for every valid id),
# so the name goes through the search, which does work.

[page_tags]
# The "Tags:" row under the player — not the keywords meta, which is the
# site's slogan on every page.
select = ".video-tags a.is-keyword"

