# xvideos — read from its search listing. Verified live 2026-09-17: 27 rows a
# page, `p` is 0-based, page 2 shares no id with page 1.
# No dimensions are published, so the thumb's 16:9 is declared rather than
# guessed per row; `keep_usable` needs a ratio and a wrong one is worse.
id = "xvideos"
label = "xvideos"
category = "adult"
adult = true
# The row is a poster frame; the viewer resolves the page when you open one.
family = "video"

[request]
url = "https://www.xvideos.com/?k={query}&p={page0}"
format = "html"
limit = 27
space = "+"

[capabilities]
text = true

[html]
row = ".thumb-block"
base = "https://www.xvideos.com"

[html.fields]
id = { attr = "data-id" }
thumb = { sel = ".thumb img", attr = "data-src" }
page = { sel = ".thumb a", attr = "href" }
title = { sel = "p.title a", attr = "title" }
author = { sel = ".metadata .name" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
author = "author"
width = "=640"
height = "=360"

