# YouJizz — read from its search listing. Verified live 2026-09-17: rows a
# page, page 2 disjoint from page 1. Thumbs are protocol-relative and lazy, so
# the real URL is on `data-original` rather than `src`.
id = "youjizz"
label = "YouJizz"
category = "adult"
adult = true
family = "video"

[request]
url = "https://www.youjizz.com/search/{query}-{page}.html"
format = "html"
limit = 36
space = "-"

[capabilities]
text = true

[html]
row = "div.video-item"
base = "https://www.youjizz.com"

[html.fields]
id = { sel = "a.frame", attr = "data-video-id" }
page = { sel = "a.frame", attr = "href" }
thumb = { sel = "img.lazy", attr = "data-original" }
title = { sel = ".video-title a" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
page_url = "page"
width = "=640"
height = "=360"

