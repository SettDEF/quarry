# YouPorn — read from its search listing. One markup shape across Aylo's tube sites
# (youporn, tube8, spankwire), so the three manifests differ only in the URL.
# Verified live 2026-09-17: rows a page, page 2 disjoint from page 1.
# No dimensions published; the poster is 16:9, declared rather than guessed.
id = "youporn"
label = "YouPorn"
category = "adult"
adult = true
# The row is a poster frame; the viewer resolves the page when you open one.
family = "video"


# Its thumbnail CDN answers 403 to a request with no Referer — measured
# 2026-09-27: every tile in the wall was blank while the metadata came back
# fine. `referer_hosts` extends it to the CDN, which is a different domain
# from the site and so would not otherwise be covered.
referer = "https://www.youporn.com/"
referer_hosts = ["ypncdn.com", "youporn.com"]
[request]
url = "https://www.youporn.com/search/?query={query}&page={page}"
format = "html"
limit = 36
space = "+"

[capabilities]
text = true

[html]
row = "article.video-box"
base = "https://www.youporn.com"

[html.fields]
id = { attr = "data-video-id" }
title = { attr = "aria-label" }
author = { attr = "data-uploader-name" }
thumb = { sel = "img.thumb-image", attr = "data-src" }
page = { sel = "a", attr = "href" }

[map]
id = "id"
url = "thumb"
thumb = "thumb"
title = "title"
author = "author"
page_url = "page"
width = "=640"
height = "=360"

# THE SITE'S OWN TABLE OF CONTENTS, as things you can pick.
# Categories run the site's own search for that word — pornhub's
# `category=` parameter rejects ids from its own categories endpoint
# (probed 2026-09-17: "Category does not exist!" for every valid id),
# so the name goes through the search, which does work.

[page_tags]
# The video's own tags and categories, in attributes on its player
# (measured 2026-10-23: 12 tags, 5 categories on one page).
attrs = ["data-context-tag", "data-context-category"]
skip = ["hd", "verified amateurs"]

